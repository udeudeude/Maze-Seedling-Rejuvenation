name: Test and deploy MAZE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate maze and application
        run: npm test
      - name: Install browser test tools
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Browser acceptance test
        run: node tests/browser-smoke.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    concurrency:
      group: github-pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report Pages deployment result
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        with:
          script: |
            const ok = process.env.DEPLOY_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'maze/github-pages',
              description: ok ? 'Maze is deployed to GitHub Pages' : 'Maze Pages deployment failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
